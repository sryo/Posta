name: Release

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check macOS bundle files
        if: matrix.platform == 'macos-latest'
        run: |
          missing=0
          for f in src-tauri/Posta.provisionprofile src-tauri/Entitlements.plist; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::$f is missing; the signed macOS bundle embeds it (see bundle.macOS in src-tauri/tauri.conf.json)"
              missing=1
            fi
          done
          exit $missing

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and test frontend
        run: npm run typecheck && npm test

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Posta ${{ github.ref_name }}'
          releaseBody: 'See the assets for download links.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify macOS bundle
        if: matrix.platform == 'macos-latest'
        run: scripts/verify-macos-bundle.sh src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Posta.app
